name: Dependency review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: [self-hosted, prd-genie]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
