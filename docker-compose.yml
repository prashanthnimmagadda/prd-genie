services:
  prd-genie:
    build: .
    environment:
      PRD_GENIE_DATA_DIR: /data
      PRD_GENIE_MODEL_CACHE_DIR: /models
      PRD_GENIE_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3210:3210'
    volumes:
      - prd-genie-data:/data
      - prd-genie-models:/models
    restart: unless-stopped

volumes:
  prd-genie-data:
  prd-genie-models:
